
# Docs: https://github.com/Azure/webapps-deploy
# Build and deploy Permit Declaration to Azure App Service - crmtest

name: Build and deploy Node.js app to Azure Web App - crmtest

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install root dependencies
        run: npm install

      - name: Install server dependencies
        run: npm --prefix server install

      - name: Install client dependencies
        run: npm --prefix client install

      - name: Build client
        run: npm --prefix client run build

      - name: Run tests
        run: npm run test --if-present

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            package.json
            package-lock.json
            server/
            client/dist/
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'crmtest'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_CRMTEST }}
